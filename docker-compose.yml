# Локальный стек: PostgreSQL + fitness API + Caddy (reverse proxy).
# Из корня репозитория:
#   cp backend/.env.example backend/.env
#   # заполните JWT_SECRET и DEEPSEEK_API_KEY в backend/.env
#   docker compose up -d
# API напрямую: http://localhost:3000/health
# Через Caddy:    http://localhost/health  или  https://localhost/health

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: fitness_db
    volumes:
      - fitness_pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/schema_migration_v2.sql:/docker-entrypoint-initdb.d/02-migration_v2.sql:ro
      - ./backend/schema_migration_v3.sql:/docker-entrypoint-initdb.d/03-migration_v3.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fitness_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://admin:123456@postgres:5432/fitness_db
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  fitness_pg_data:
  caddy_data:
  caddy_config:
